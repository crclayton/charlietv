a        add volume 5
e        add volume -5
UP       add volume 5
DOWN     add volume -5

KP5      cycle-values glsl-shaders "Default" "NoChroma.hook" "crt-gdv-mini-ultra-trinitron.glsl" "crt-hyllian.glsl" "crt-lottes.glsl" "crt-royale-kurozumi.glsl"

KP7      add chapter -1
KP9      add chapter  1
KP1      seek -5
KP3      seek 10

KP_INS   seek 0.25 absolute-percent ; show-text "Let's get restarted in here"
KP0      seek 0.25 absolute-percent ; show-text "Let's get restarted in here"
-        seek 0.25 absolute-percent ; show-text "Let's get restarted in here"
0        seek 0.25 absolute-percent ; show-text "Let's get restarted in here"

ENTER    script-binding nextfile
KP_ENTER script-binding nextfile

SPACE    cycle pause ; no-osd cycle-values glsl-shaders "NoChroma.hook" "Default" ; script-message toggle-info
y        cycle pause ; no-osd cycle-values glsl-shaders "NoChroma.hook" "Default" ; script-message toggle-info

f        cycle fullscreen ; no-osd set geometry 50%+0+0
u        cycle fullscreen ; no-osd set geometry 50%+0+0

# Channel navigation → charlietv3_keys.lua
LEFT     script-binding charlietv3_keys/tv-prev
RIGHT    script-binding charlietv3_keys/tv-next
o        script-binding charlietv3_keys/tv-prev
w        script-binding charlietv3_keys/tv-prev
,        script-binding charlietv3_keys/tv-next
s        script-binding charlietv3_keys/tv-next

# Quit
#ESC      script-binding charlietv3_keys/tv-quit
'        script-binding charlietv3_keys/tv-quit
q        script-binding charlietv3_keys/tv-quit
BS       script-binding charlietv3_keys/tv-quit
KP_DEL   script-binding charlietv3_keys/tv-quit
KP_DEC   script-binding charlietv3_keys/tv-quit

# File operations
DEL      script-binding charlietv3_keys/tv-delete
k        script-binding charlietv3_keys/tv-save
t        script-binding charlietv3_keys/tv-save
