# Also bound in scripts: KP4/KP6 (nextfile.lua); ; ;; ' '' and restart/quit keys q y 0 KP0 KP_INS (double_press.lua)

a        add volume 5
d        add volume -5
UP       add volume 5
DOWN     add volume -5

KP5      cycle-values glsl-shaders "Default" "NoChroma.hook" "crt-gdv-mini-ultra-trinitron.glsl" "crt-hyllian.glsl" "crt-lottes.glsl" "crt-royale-kurozumi.glsl"

KP7      add chapter -1
KP9      add chapter  1
KP1      seek -5
KP3      seek 10

SPACE    cycle pause
t        cycle pause
f        cycle fullscreen ; no-osd set geometry 50%+0+0
u        cycle fullscreen ; no-osd set geometry 50%+0+0

LEFT     script-binding charlietv3_keys/tv-prev
RIGHT    script-binding charlietv3_keys/tv-next
s        script-binding charlietv3_keys/tv-prev
,        script-binding charlietv3_keys/tv-prev
w        script-binding charlietv3_keys/tv-next

KP_DEL   script-binding charlietv3_keys/tv-quit
KP_DEC   script-binding charlietv3_keys/tv-quit

DEL      script-binding charlietv3_keys/tv-delete
HOME     script-binding charlietv3_keys/tv-save

8        script-binding charlietv3_keys/tv-random
KP8      script-binding charlietv3_keys/tv-random

